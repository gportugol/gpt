# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # Exit code 183 cancels pull request builds, which are of type
      # "external", so only master (latest) and release tags (stable) publish.
      - if [ "$READTHEDOCS_VERSION_TYPE" = "external" ]; then exit 183; fi

sphinx:
  configuration: doc/manual/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: doc/manual/requirements.txt
