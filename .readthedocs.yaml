# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      # Publish released versions only: exit code 183 cancels the build of
      # branches (latest) and pull requests, while stable and release tags
      # are both of type "tag".
      - if [ "$READTHEDOCS_VERSION_TYPE" != "tag" ]; then exit 183; fi

sphinx:
  configuration: doc/manual/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: doc/manual/requirements.txt
