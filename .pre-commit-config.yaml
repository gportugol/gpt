repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        files: \.(cpp|cc|cxx|c|h|hpp)$

  # Issue #17 -- o repositorio e UTF-8, com excecoes contadas.
  #
  # Hook local (`language: system`) porque o pre-commit nao traz um pronto
  # para codificacao, e a lista de excecoes precisa carregar o MOTIVO de
  # cada arquivo -- coisa que `exclude:` com regex nao comporta.
  - repo: local
    hooks:
      - id: check-encoding
        name: arquivos de texto em UTF-8
        entry: stuff/check-encoding.py
        language: system
        types: [text]
