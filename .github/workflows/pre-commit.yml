name: pre-commit

on:
  push:
  pull_request:

# Issue #26 -- privilegio minimo para o GITHUB_TOKEN.
#
# Sem bloco `permissions:`, o escopo do token vem da configuracao do
# repositorio/organizacao, que nao aparece no codigo e pode mudar sem que
# ninguem note. Declarado aqui, o escopo fica versionado. Nenhum job deste
# arquivo escreve no repositorio: so faz checkout e sobe artefatos (o
# upload/download de artefatos usa o token de runtime, nao o GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
