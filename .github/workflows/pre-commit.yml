name: pre-commit

on:
  # Issue #9 -- `push` apenas no branch padrao.
  #
  # Com `push` e `pull_request` ambos sem filtro, um push num branch COM PR
  # aberto dispara os dois: duas execucoes identicas do mesmo commit.
  push:
    branches:
      - master
  pull_request:

# Um push novo cancela a execucao anterior do mesmo branch. No master fica
# DESLIGADO de proposito: ali cada commit e um estado publicado, e perder o
# resultado de um deles esconderia uma quebra.
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
