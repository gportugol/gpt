name: Release GPT
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-for-release:
    uses: ./.github/workflows/build.yml
    with:
      target: all

  build-manual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: doc/manual/requirements.txt

      - name: Install Sphinx
        run: pip install -r doc/manual/requirements.txt

      - name: Install TeX Dependencies
        run: |
          sudo apt update
          sudo apt install -y latexmk texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-portuguese tex-gyre

      # Same sources and warning policy as .readthedocs.yaml: the HTML pass
      # only checks that Read the Docs will accept this tag, the PDF ships.
      - name: Build HTML manual
        run: sphinx-build -M html doc/manual doc/_build -W --keep-going

      - name: Build PDF manual
        run: sphinx-build -M latexpdf doc/manual doc/_build -W --keep-going

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-pdf
          path: doc/_build/latex/manual.pdf

  upload-manual:
    needs: build-manual
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manual-pdf
          path: release/manual

      - name: Upload manual to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" release/manual/manual.pdf --clobber
          --repo "$GITHUB_REPOSITORY"

  upload-source-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential autoconf automake libtool \
            pkg-config libantlr-dev libpcre2-dev nasm

      - name: Build source tarball
        run: |
          autoreconf -i
          ./configure
          make dist

      - name: Upload source tarball to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "$TAG" gpt-*.tar.gz --clobber
          --repo "$GITHUB_REPOSITORY"

  upload-release-assets:
    needs: build-for-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpt-windows
          path: release/windows

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpt-linux
          path: release/linux

      - name: Repack Windows zip
        run: |
          cd release
          TAG=${{ github.event.release.tag_name }}
          mv windows "gpt-${TAG}"
          zip -r "gpt-win-x86_64.zip" "gpt-${TAG}"
          rm -rf "gpt-${TAG}"

      - name: Repack Linux tar.gz
        run: |
          cd release
          TAG=${{ github.event.release.tag_name }}
          mv linux "gpt-${TAG}"
          # The artifact zip stores every file as 644.
          chmod +x "gpt-${TAG}/bin/gpt"
          tar -czf "gpt-linux-x86_64.tar.gz" "gpt-${TAG}"
          rm -rf "gpt-${TAG}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/gpt-win-x86_64.zip
            release/gpt-linux-x86_64.tar.gz
