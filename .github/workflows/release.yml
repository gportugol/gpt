name: Release GPT
on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  build-for-release:
    uses: ./.github/workflows/build.yml
    with:
      target: all

  upload-release-assets:
    needs: build-for-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gpt-windows
          path: release/windows

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gpt-linux
          path: release/linux

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manual-pdf
          path: release/manual

      - name: Repack Windows zip
        run: |
          cd release
          TAG=${{ github.event.release.tag_name }}
          mv windows "gpt-${TAG}"
          zip -r "gpt-win-x86_64.zip" "gpt-${TAG}"
          rm -rf "gpt-${TAG}"

      - name: Repack Linux tar.gz
        run: |
          cd release
          TAG=${{ github.event.release.tag_name }}
          mv linux "gpt-${TAG}"
          tar -czf "gpt-linux-x86_64.tar.gz" "gpt-${TAG}"
          rm -rf "gpt-${TAG}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release/gpt-win-x86_64.zip
            release/gpt-linux-x86_64.tar.gz
            release/manual/manual.pdf
