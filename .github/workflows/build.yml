name: Build GPT Binary
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential autoconf automake libtool \
            pkg-config antlr4 libantlr4-runtime-dev libpcre2-dev nasm git \
            binutils-aarch64-linux-gnu qemu-user

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tarball ships this gpt without libantlr4-runtime, so
      # link the runtime statically.
      - name: Build GPT Project
        run: |
          autoreconf -i
          ./configure --prefix=/usr/local CXXFLAGS="-Wall -Wextra -Werror" \
            ANTLR4_LIB="$(g++ -print-file-name=libantlr4-runtime.a)"
          make -j$(nproc)

      # The suites run here, where the shared runtime is installed, so they
      # would not notice gpt depending on it again.
      - name: Check Static ANTLR4 Runtime
        run: |
          dynamic=$(readelf -d src/gpt)
          if printf '%s\n' "$dynamic" | grep -q libantlr4-runtime; then
            echo "src/gpt needs the shared libantlr4-runtime," \
              "which the release tarball does not carry" >&2
            exit 1
          fi

      - name: Run Tests
        run: bash test/run_test.sh

      - name: Run Tests for arm64 under QEMU
        run: GPT_TEST_ARCH=arm64 GPT_TEST_RUNNER=qemu-aarch64 bash test/run_test.sh

      # The licenses of the ANTLR4 runtime linked into gpt ask binary copies
      # to include their notices.
      - name: Package Linux
        run: |
          make install DESTDIR=$PWD/release
          mkdir -p dist
          mv release/usr/local/* dist/
          mkdir -p dist/share/doc/libantlr4-runtime
          cp /usr/share/doc/libantlr4-runtime-dev/copyright \
            dist/share/doc/libantlr4-runtime/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpt-linux-x86_64
          path: dist/*

  build-linux-aarch64:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie
    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential autoconf automake libtool \
            pkg-config antlr4 libantlr4-runtime-dev libpcre2-dev git

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release tarball ships this gpt without libantlr4-runtime, so
      # link the runtime statically.
      - name: Build GPT Project
        run: |
          autoreconf -i
          ./configure --prefix=/usr/local CXXFLAGS="-Wall -Wextra -Werror" \
            ANTLR4_LIB="$(g++ -print-file-name=libantlr4-runtime.a)"
          make -j$(nproc)

      # The suites run here, where the shared runtime is installed, so they
      # would not notice gpt depending on it again.
      - name: Check Static ANTLR4 Runtime
        run: |
          dynamic=$(readelf -d src/gpt)
          if printf '%s\n' "$dynamic" | grep -q libantlr4-runtime; then
            echo "src/gpt needs the shared libantlr4-runtime," \
              "which the release tarball does not carry" >&2
            exit 1
          fi

      - name: Run Tests
        run: bash test/run_test.sh

      # The licenses of the ANTLR4 runtime linked into gpt ask binary copies
      # to include their notices.
      - name: Package Linux
        run: |
          make install DESTDIR=$PWD/release
          mkdir -p dist
          mv release/usr/local/* dist/
          mkdir -p dist/share/doc/libantlr4-runtime
          cp /usr/share/doc/libantlr4-runtime-dev/copyright \
            dist/share/doc/libantlr4-runtime/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpt-linux-aarch64
          path: dist/*

  build-linux-i386:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    # Docker 29.4.2 on the ubuntu-26.04 image denies socketcall(2), which
    # i386 glibc uses for its sockets, so an i386 container has no network
    # there: https://github.com/actions/runner-images/issues/14790
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # In a job container, actions/checkout runs the runner's amd64 node,
      # which an i386 image cannot load, so the steps start their own.
      - name: Start i386 Container
        run: >-
          docker run -d --name i386 --platform linux/386
          -v "$PWD:/w" -w /w debian:trixie sleep infinity

      - name: Install Build Dependencies
        run: |
          docker exec i386 apt-get update
          docker exec i386 apt-get install -y build-essential autoconf \
            automake libtool pkg-config antlr4 libantlr4-runtime-dev \
            libpcre2-dev nasm

      - name: Build GPT Project
        run: >-
          docker exec i386 bash -c 'autoreconf -i &&
          ./configure --prefix=/usr/local CXXFLAGS="-Wall -Wextra -Werror" &&
          make -j$(nproc)'

      - name: Run Tests with uname x86_64
        run: docker exec i386 bash test/run_test.sh

      - name: Run Tests under linux32 as in sbuild
        run: docker exec i386 setarch i686 bash test/run_test.sh

  build-windows-x86_64:
    if: ${{ inputs.target == 'windows' || inputs.target == 'all' }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          update: true
          msystem: UCRT64
          path-type: inherit
          install: >-
            autoconf
            automake
            libtool
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-antlr4-runtime-cpp
            pkg-config
            unzip
            wget

      - name: Cache JDK 25
        id: cache-jdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\a\gpt\gpt\jdk-25.0.1
          key: jdk-25.0.1-2bbae75b-cache

      - shell: msys2 {0}
        name: Install Java JDK 25
        if: steps.cache-jdk.outputs.cache-hit != 'true'
        run: |
          wget https://download.java.net/java/GA/jdk25.0.1/2fbf10d8c78e40bd87641c434705079d/8/GPL/openjdk-25.0.1_windows-x64_bin.zip
          echo "2bbae75bc31a848b7cb5f297270efb7bef9bba0deeec6a671625563dc090ad69  openjdk-25.0.1_windows-x64_bin.zip" | sha256sum -c -
          unzip openjdk-25.0.1_windows-x64_bin.zip

      - shell: msys2 {0}
        name: Configure Java JDK 25 PATH
        run: |
          cygpath -w "$(pwd)/jdk-25.0.1/bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/jdk-25.0.1/bin:$PATH"
          java -version

      - name: Cache ANTLR4 Tool
        id: cache-antlr4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:/a/_temp/antlr4
          key: antlr4-4.13.2-eae2dfa1-tool

      - shell: msys2 {0}
        name: Setup ANTLR4 Tool
        run: |
          # Download ANTLR4 JAR if not cached
          if [ ! -f /d/a/_temp/antlr4/antlr-4.13.2-complete.jar ]; then
            mkdir -p /d/a/_temp/antlr4
            wget -O /d/a/_temp/antlr4/antlr-4.13.2-complete.jar https://www.antlr.org/download/antlr-4.13.2-complete.jar
          fi
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  /d/a/_temp/antlr4/antlr-4.13.2-complete.jar" | sha256sum -c -
          # Create antlr4 wrapper script using the JDK put on PATH above
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/antlr4 << 'EOF'
          #!/bin/bash
          java -jar /d/a/_temp/antlr4/antlr-4.13.2-complete.jar "$@"
          EOF
          chmod +x /usr/local/bin/antlr4

      - shell: msys2 {0}
        name: Build GPT Project
        run: |
          export LDFLAGS="-static -static-libgcc -static-libstdc++"
          autoreconf -i
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install

      - shell: msys2 {0}
        name: Run Tests
        run: bash test/run_test.sh

      - shell: msys2 {0}
        name: Package Windows Binary
        run: |
          make install DESTDIR=$PWD/release
          mkdir -p dist
          mv release/usr/local/* dist/
          cp /ucrt64/bin/nasm.exe dist/bin/
          ldd /usr/local/bin/gpt | grep "/ucrt64/" | awk '{print $3}' | while read dll; do
              if [ -f "$dll" ]; then
                  echo "Copying $dll"
                  cp "$dll" dist/bin/
              fi
          done

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpt-windows-x86_64
          path: dist/*
