name: Build GPT Binary
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  contents: read

jobs:
  generate-manual-pdf:
    if: ${{ inputs.target == 'manual-pdf' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install TeX Dependencies
        run: |
          sudo apt update
          sudo apt install -y latex-make texlive-latex-base texlive-lang-portuguese

      - name: Generate PDF from manual.tex
        run: |
          # First run: generate .toc and auxiliary files
          pdflatex -interaction=nonstopmode -output-directory=doc doc/manual/manual.tex
          # Second run: resolve table of contents and references
          pdflatex -interaction=nonstopmode -output-directory=doc doc/manual/manual.tex
          # Third run:  Label(s) may have changed. Rerun to get cross-references right.
          pdflatex -interaction=nonstopmode -output-directory=doc doc/manual/manual.tex

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-pdf
          path: doc/manual.pdf

  build-linux:
    if: ${{ inputs.target == 'linux' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install Build Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential autoconf automake libtool \
            pkg-config antlr4 libantlr4-runtime-dev libpcre2-dev nasm git

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build GPT Project
        run: |
          autoreconf -i
          ./configure --prefix=/usr/local
          make -j$(nproc)

      - name: Run Tests
        run: bash test/run_test.sh

      - name: Package Linux
        run: |
          make install DESTDIR=$PWD/release
          mkdir -p dist
          mv release/usr/local/* dist/

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-linux
          path: dist/*

  build-windows:
    if: ${{ inputs.target == 'windows' || inputs.target == 'all' }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSYS2 Environment
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          update: true
          msystem: UCRT64
          path-type: inherit
          install: >-
            autoconf
            automake
            libtool
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-pcre2
            mingw-w64-ucrt-x86_64-antlr4-runtime-cpp
            pkg-config
            unzip
            wget

      - name: Cache JDK 25
        id: cache-jdk
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\a\gpt\gpt\jdk-25.0.1
          key: jdk-25.0.1-2bbae75b-cache

      - shell: msys2 {0}
        name: Install Java JDK 25
        if: steps.cache-jdk.outputs.cache-hit != 'true'
        run: |
          wget https://download.java.net/java/GA/jdk25.0.1/2fbf10d8c78e40bd87641c434705079d/8/GPL/openjdk-25.0.1_windows-x64_bin.zip
          echo "2bbae75bc31a848b7cb5f297270efb7bef9bba0deeec6a671625563dc090ad69  openjdk-25.0.1_windows-x64_bin.zip" | sha256sum -c -
          unzip openjdk-25.0.1_windows-x64_bin.zip

      - shell: msys2 {0}
        name: Configure Java JDK 25 PATH
        run: |
          cygpath -w "$(pwd)/jdk-25.0.1/bin" >> "$GITHUB_PATH"
          export PATH="$(pwd)/jdk-25.0.1/bin:$PATH"
          java -version

      - name: Cache ANTLR4 Tool
        id: cache-antlr4
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:/a/_temp/antlr4
          key: antlr4-4.13.2-eae2dfa1-tool

      - shell: msys2 {0}
        name: Setup ANTLR4 Tool
        run: |
          # Download ANTLR4 JAR if not cached
          if [ ! -f /d/a/_temp/antlr4/antlr-4.13.2-complete.jar ]; then
            mkdir -p /d/a/_temp/antlr4
            wget -O /d/a/_temp/antlr4/antlr-4.13.2-complete.jar https://www.antlr.org/download/antlr-4.13.2-complete.jar
          fi
          echo "eae2dfa119a64327444672aff63e9ec35a20180dc5b8090b7a6ab85125df4d76  /d/a/_temp/antlr4/antlr-4.13.2-complete.jar" | sha256sum -c -
          # Create antlr4 wrapper script using the JDK put on PATH above
          mkdir -p /usr/local/bin
          cat > /usr/local/bin/antlr4 << 'EOF'
          #!/bin/bash
          java -jar /d/a/_temp/antlr4/antlr-4.13.2-complete.jar "$@"
          EOF
          chmod +x /usr/local/bin/antlr4

      - shell: msys2 {0}
        name: Build GPT Project
        run: |
          export CXXFLAGS="-O2 -std=gnu++17 -static -static-libgcc -static-libstdc++"
          export LDFLAGS="-static -static-libgcc -static-libstdc++"
          autoreconf -i
          ./configure --prefix=/usr/local
          make -j$(nproc)
          make install

      - shell: msys2 {0}
        name: Install NASM
        run: |
          wget https://www.nasm.us/pub/nasm/releasebuilds/0.99.05/nasm-0.99.05-win32.zip
          echo "cc9d5e2890e230f51db617e414b9a5e6e107d1cd3a80d19018c8a53bde277408  nasm-0.99.05-win32.zip" | sha256sum -c -
          unzip nasm-0.99.05-win32.zip
          cp nasm.exe /ucrt64/bin/

      - shell: msys2 {0}
        name: Run Tests
        run: bash test/run_test.sh

      - shell: msys2 {0}
        name: Package Windows Binary
        run: |
          make install DESTDIR=$PWD/release
          mkdir -p dist
          mv release/usr/local/* dist/
          cp /ucrt64/bin/nasm.exe dist/bin/
          ldd /usr/local/bin/gpt | grep "/ucrt64/" | awk '{print $3}' | while read dll; do
              if [ -f "$dll" ]; then
                  echo "Copying $dll"
                  cp "$dll" dist/bin/
              fi
          done

      - name: Upload Windows ZIP Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-windows
          path: dist/*
