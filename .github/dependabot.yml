version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/doc/manual"
    schedule:
      interval: "weekly"
    groups:
      docs:
        patterns:
          - "*"
